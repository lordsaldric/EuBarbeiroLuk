<!doctype html>

  <meta name="robots" content="noindex,nofollow">
  <title>Confirmando acesso | Eu Barbeiro Luk</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<body class="auth-page">
  <main class="auth-layout">
    <a class="auth-brand" href="/" aria-label="Voltar ao site Eu Barbeiro Luk">

      <strong>EuBarbeiro<em>Luk</em></strong>

      <a class="admin-button admin-button-primary callback-link" id="callback-link" href="/admin/login" hidden>Ir para o login <span>↗</span></a>
