<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06130e">
  <meta name="robots" content="noindex,nofollow">
  <title>Primeiro acesso | Eu Barbeiro Luk</title>
  <link rel="icon" href="../imagens/logo-marca.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css?v=3">
  <script src="../vendor/supabase.min.js" defer></script>
  <script src="../scripts/config.js?v=3" defer></script>
  <script src="../scripts/supabase-client.js?v=3" defer></script>
  <script src="auth.js?v=3" defer></script>
</head>
<body class="auth-page" data-auth-mode="register">
  <main class="auth-layout">
    <a class="auth-brand" href="../index.html" aria-label="Voltar ao site Eu Barbeiro Luk">
      <span><img src="../imagens/logo-marca.png" alt=""></span>
      <strong>EuBarbeiro<em>Luk</em></strong>
    </a>
    <section class="auth-card liquid-panel" aria-labelledby="auth-title">
      <p class="admin-eyebrow"><span></span> Primeiro acesso</p>
      <h1 id="auth-title">Crie sua <em>senha.</em></h1>
      <p class="auth-intro">Use o e-mail previamente autorizado para ativar seu acesso de dono.</p>
      <form class="auth-form" id="register-form">
        <label for="register-email">E-mail autorizado</label>
        <input id="register-email" name="email" type="email" autocomplete="username" required placeholder="seu@email.com">
        <label for="register-password">Nova senha</label>
        <div class="password-field">
          <input id="register-password" name="password" type="password" minlength="8" autocomplete="new-password" required placeholder="Mínimo de 8 caracteres">
          <button type="button" data-toggle-password aria-label="Mostrar senha">Ver</button>
        </div>
        <div class="auth-message" id="auth-message" role="status" aria-live="polite"></div>
        <button class="admin-button admin-button-primary" type="submit">Criar acesso <span>↗</span></button>
      </form>
      <div class="auth-footer"><a href="login.html">Já tenho acesso</a><a href="../index.html">Voltar ao site</a></div>
    </section>
    <p class="auth-security"><span>●</span> Apenas e-mails autorizados recebem acesso administrativo</p>
  </main>
</body>
</html>
