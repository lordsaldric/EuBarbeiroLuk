<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06130e">
  <meta name="robots" content="noindex,nofollow">
  <title>Área dos donos | Eu Barbeiro Luk</title>
  <link rel="icon" href="../imagens/logo-marca.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css?v=3">
  <script src="../vendor/supabase.min.js" defer></script>
  <script src="../scripts/config.js?v=3" defer></script>
  <script src="../scripts/supabase-client.js?v=3" defer></script>
  <script src="auth.js?v=3" defer></script>
</head>
<body class="auth-page" data-auth-mode="login">
  <main class="auth-layout">
    <a class="auth-brand" href="../index.html" aria-label="Voltar ao site Eu Barbeiro Luk">
      <span><img src="../imagens/logo-marca.png" alt=""></span>
      <strong>EuBarbeiro<em>Luk</em></strong>
    </a>

    <section class="auth-card liquid-panel" aria-labelledby="auth-title">
      <p class="admin-eyebrow"><span></span> Área exclusiva</p>
      <h1 id="auth-title">Acesso dos <em>donos.</em></h1>
      <p class="auth-intro">Entre com um usuário autorizado para administrar a agenda da barbearia.</p>
      <form class="auth-form" id="login-form">
        <label for="login-email">E-mail</label>
        <input id="login-email" name="email" type="email" autocomplete="username" required placeholder="seu@email.com">
        <label for="login-password">Senha</label>
        <div class="password-field">
          <input id="login-password" name="password" type="password" minlength="6" autocomplete="current-password" required placeholder="Sua senha">
          <button type="button" data-toggle-password aria-label="Mostrar senha">Ver</button>
        </div>
        <div class="auth-message" id="auth-message" role="status" aria-live="polite"></div>
        <button class="admin-button admin-button-primary" type="submit">Entrar no painel <span>↗</span></button>
      </form>
      <div class="auth-footer"><a href="primeiro-acesso.html">Primeiro acesso</a><a href="../index.html">Voltar ao site</a></div>
    </section>
    <p class="auth-security"><span>●</span> Agenda protegida por autenticação e políticas de acesso</p>
  </main>
</body>
</html>
